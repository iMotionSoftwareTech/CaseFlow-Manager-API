name: publish-dev

on:
  push:
    branches: [ dev ]

permissions:
  contents: read
  packages: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # change to '9.0.x' when runner supports .NET 9
          
      # Add GitHub Packages feed (owner = repo owner by default)
      - name: Add GitHub Packages feed
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "github" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: List nuget sources (debug)
        run: dotnet nuget list source
        
      - name: Restore
        run: dotnet restore CaseFlowManager.API/CaseFlowManager.API.sln

      - name: Build
        run: dotnet build CaseFlowManager.API/CaseFlowManager.API.sln -c Release --no-restore

      - name: Pack Models package
        run: dotnet pack CaseFlowManager.API/CaseFlowManager.API.Models/CaseFlowManager.API.Models.csproj \
               -c Release -o ./artifacts -p:PackageVersion=0.1.0-dev.${{ github.run_number }}

      - name: List artifacts
        run: ls -l ./artifacts || true

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
